<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工单看板系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f4f5f7; color: #2c2c2a; padding: 32px 16px;
  }
  .wrap { text-align: center; max-width: 900px; }
  h1 { font-size: 26px; font-weight: 500; margin-bottom: 8px; }
  p.sub { color: #888780; font-size: 14px; margin-bottom: 36px; line-height: 1.8; }
  .entries { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  a.card {
    display: block; width: 250px; padding: 28px 22px; border-radius: 12px;
    background: #fff; border: 1px solid rgba(0,0,0,.08); text-decoration: none;
    color: #2c2c2a; transition: transform .15s, box-shadow .15s; text-align: left;
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
  a.card h2 { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
  a.card p { font-size: 13px; color: #888780; line-height: 1.7; }
  .blue { border-top: 3px solid #185fa5; }
  .teal { border-top: 3px solid #0f6e56; }
  .purple { border-top: 3px solid #534ab7; }
  .foot { margin-top: 34px; color: #888780; font-size: 13px; line-height: 2; }
  .foot code { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 6px; padding: 2px 7px; font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>工单看板系统</h1>
  <p class="sub">电商订单 → 业务员上传材料 → 大屏展示 → 手机扫码反馈（数据存云端，手机 / 电视 / 电脑自动同步）</p>
  <div class="entries">
    <a class="card blue" href="admin.html">
      <h2>业务员工作台</h2>
      <p>录入订单、上传要求与材料图片、回复制作端疑问、跟进状态</p>
    </a>
    <a class="card teal" href="kanban.html">
      <h2>大屏看板</h2>
      <p>给电视 / 显示屏全屏打开用，只做展示，自动刷新轮播</p>
    </a>
    <a class="card purple" href="feedback.html">
      <h2>工人操作页</h2>
      <p>工人扫工单二维码进入：开工、完工、提问、传图传语音都在这里操作</p>
    </a>
  </div>
  <div class="foot">
    业务员首次使用在登录页用<b>邀请码</b>注册账号<br>
    大屏按业务员分屏：<code>kanban.html?owner=姓名</code>
  </div>
</div>
</body>
</html>
